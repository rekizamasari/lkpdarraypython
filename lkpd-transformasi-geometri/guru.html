<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Guru — LKPD Transformasi Geometri</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="topbar">
    <h1>📊 Dashboard Guru</h1>
    <span class="chip" id="profil-nama">…</span>
    <div class="aksi">
      <span class="chip"><span class="live-dot"></span>&nbsp;realtime</span>
      <button class="btn btn-ghost btn-sm" id="btn-refresh">🔄 Refresh</button>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Keluar</button>
    </div>
  </header>

  <main class="container">
    <div class="tab-bar">
      <button class="tab-btn aktif" data-tab="analitik">📈 Analitik Kelas</button>
      <button class="tab-btn" data-tab="nilai">🗂️ Nilai Siswa</button>
      <button class="tab-btn" data-tab="rincian">💬 Rincian Jawaban</button>
      <button class="tab-btn" data-tab="materi">📖 Materi &amp; Kunci</button>
    </div>

    <!-- ======== TAB: ANALITIK ======== -->
    <section class="tab-page aktif" id="tab-analitik">
      <div class="input-row" style="margin-bottom:16px">
        <div>
          <label>Filter Kelas</label>
          <select id="filter-kelas"><option value="">Semua Kelas</option></select>
        </div>
        <div>
          <label>Kelas Baru</label>
          <button class="btn btn-hijau" id="btn-kelas-baru" style="width:100%">➕ Tambah Kelas</button>
        </div>
      </div>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="chart-box">
        <h4>📊 Rata-rata Nilai per Modul (praktik &amp; kuis)</h4>
        <div class="chart-canvas"><canvas id="chart-1"></canvas></div>
      </div>
      <div class="chart-box">
        <h4>📈 Diagram: berapa siswa yang menyelesaikan praktik tiap modul</h4>
        <div class="chart-canvas"><canvas id="chart-2"></canvas></div>
      </div>
    </section>

    <!-- ======== TAB: NILAI ======== -->
    <section class="tab-page" id="tab-nilai">
      <div class="lec-panel" style="padding:14px 18px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <b style="color:var(--aqua)">Rekap nilai per siswa × modul</b>
          <span class="muted">⭐ nilai akhir = 50% praktik + 50% kuis</span>
          <button class="btn btn-ghost btn-sm" id="btn-csv" style="margin-left:auto">⬇️ Unduh CSV</button>
        </div>
      </div>
      <div class="lec-panel" style="overflow-x:auto">
        <table class="data" id="tabel-nilai"></table>
      </div>
    </section>

    <!-- ======== TAB: RINCIAN ======== -->
    <section class="tab-page" id="tab-rincian">
      <div class="lec-panel" style="overflow-x:auto">
        <h4 style="color:var(--aqua);margin-bottom:12px">🧪 Riwayat Praktik Terkini</h4>
        <table class="data" id="tabel-subs"></table>
      </div>
      <div class="lec-panel" style="overflow-x:auto">
        <h4 style="color:var(--aqua);margin-bottom:12px">📝 Riwayat Kuis Terkini</h4>
        <table class="data" id="tabel-kuis"></table>
      </div>
    </section>

    <!-- ======== TAB: MATERI & KUNCI ======== -->
    <section class="tab-page" id="tab-materi">
      <div class="lec-panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <b style="color:var(--aqua)">Pilih materi yang ingin dilihat:</b>
        <select id="materi-pilih" style="max-width:420px"></select>
      </div>
      <div id="materi-content"></div>
    </section>
  </main>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/guru.js"></script>
</body>
</html>
