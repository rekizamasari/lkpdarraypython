<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Siswa — LKPD Transformasi Geometri</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <h1>📐 LKPD Transformasi Geometri</h1>
    <span class="chip" id="profil-nama">…</span>
    <span class="chip" id="profil-kelas">…</span>
    <div class="aksi"><button class="btn btn-ghost btn-sm" id="btn-logout">Keluar</button></div>
  </header>

  <main class="container">
    <div id="salam"></div>

    <div class="info-box">➡️🪞🔄🔍🧩 <b>Translasi · Refleksi · Rotasi · Dilatasi · Komposisi</b> — praktik diisi berupa jawaban koordinat (tanpa kode program). Tekan <b>👁️ Lihat Visual</b> untuk melihat pergeseran/putaran/pencerminan pada kanvas koordinat, lalu <b>📤 Kirim Praktik</b> untuk dinilai otomatis.</div>

    <div class="modul-grid" id="daftar-modul"></div>
  </main>

  <!-- ==== MODAL MODUL PELAJARAN ==== -->
  <div class="modal-back" id="modal-back">
    <div class="modal">
      <div class="modal-head">
        <h3 id="mod-judul">Judul</h3>
        <button class="btn btn-ghost btn-sm close" id="btn-tutup">✕ Tutup</button>
      </div>
      <div id="mod-isi"></div>
    </div>
  </div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/siswa.js"></script>
</body>
</html>
