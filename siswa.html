<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Siswa — LKPD Array &amp; Rekursif</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="topbar">
    <h1>🐍 LKPD Array &amp; Rekursif</h1>
    <span class="chip" id="profil-nama">…</span>
    <span class="chip" id="profil-kelas">…</span>
    <div class="aksi"><button class="btn btn-ghost btn-sm" id="btn-logout">Keluar</button></div>
  </header>

  <main class="container">
    <div id="salam"></div>

    <div class="info-box" id="pyodide-status">🐍 <b>Lingkungan Python akan aktif otomatis</b> saat pertama kali tombol "▶️ Jalankan Kode" atau "Kirim Praktik" ditekan (unduh ±10 MB, hanya sekali per komputer). Ini menjaga halaman tetap ringan walau semua siswa membuka LKPD bersamaan.</div>

    <div class="modul-grid" id="daftar-modul"></div>
  </main>

  <!-- ==== MODAL MODUL PELAJARAN ==== -->
  <div class="modal-back" id="modal-back">
    <div class="modal">
      <div class="modal-head">
        <h3 id="mod-judul">Judul</h3>
        <button class="btn btn-ghost btn-sm close" id="btn-tutup">✕ Tutup</button>
      </div>
      <div id="mod-isi"></div>
    </div>
  </div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/siswa.js"></script>
</body>
</html>
